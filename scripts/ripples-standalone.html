<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ripples — after the field</title>
    <meta name="description" content="A quiet chemistry of light after the shards have gone still." />
    <link rel="shortcut icon" href="/shards/favicon.svg" />
    <link rel="icon" href="/shards/favicon.svg" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; min-width: 320px; margin: 0; overflow: hidden; background: #061018; }
      body { font-family: Arial, Helvetica, sans-serif; }
      .ripples-shell {
        position: fixed;
        inset: 0;
        overflow: hidden;
        isolation: isolate;
        background: radial-gradient(circle at 50% 48%, rgba(29, 62, 68, 0.28), transparent 45%), radial-gradient(circle at 50% 50%, #11242b 0%, #09171f 58%, #061018 100%);
        color: #f0f4e9;
      }
      .ripples-shell::before, .ripples-shell::after {
        position: absolute;
        z-index: 1;
        inset: 0;
        pointer-events: none;
        content: "";
      }
      .ripples-shell::before { background: radial-gradient(circle at center, transparent 35%, rgba(1, 7, 11, 0.42) 100%); }
      .ripples-shell::after {
        background: linear-gradient(180deg, rgba(3, 10, 15, 0.52), transparent 20%, transparent 79%, rgba(3, 10, 15, 0.65)), linear-gradient(90deg, rgba(3, 10, 15, 0.18), transparent 24%, transparent 76%, rgba(3, 10, 15, 0.18));
      }
      .ripples-canvas { position: absolute; z-index: 0; inset: 0; display: block; width: 100%; height: 100%; }
      .ripples-topbar { position: absolute; z-index: 2; inset: 0 0 auto; display: flex; align-items: flex-start; justify-content: space-between; padding: 28px 32px; pointer-events: none; }
      .ripples-brand { display: flex; align-items: center; gap: 13px; }
      .ripples-mark { position: relative; width: 26px; height: 26px; transform: rotate(45deg); }
      .ripples-mark span { position: absolute; display: block; border: 1px solid #efd38c; border-radius: 2px; transform: rotate(45deg); }
      .ripples-mark span:nth-child(1) { inset: 7px; }
      .ripples-mark span:nth-child(2) { inset: 3px; opacity: 0.42; }
      .ripples-mark span:nth-child(3) { inset: 11px; border-color: #d9b7ed; }
      .ripples-copy { display: flex; flex-direction: column; gap: 5px; }
      .ripples-copy strong { color: #f4f4e9; font-size: 13px; font-weight: 600; letter-spacing: 0.3em; }
      .ripples-copy span, .ripples-top-note, .ripples-bottom-note { color: rgba(201, 223, 215, 0.54); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; }
      .ripples-top-note { padding-top: 5px; text-align: right; }
      .ripples-bottom-note { position: absolute; z-index: 2; bottom: 28px; left: 32px; color: rgba(201, 223, 215, 0.54); font-size: 9px; letter-spacing: 0.16em; pointer-events: none; text-transform: uppercase; }
      .ripples-back { position: absolute; right: 32px; bottom: 28px; z-index: 3; color: rgba(201, 223, 215, 0.54); font-size: 9px; letter-spacing: 0.16em; pointer-events: auto; text-decoration: none; text-transform: uppercase; }
      .ripples-back:hover, .ripples-back:focus-visible { color: #f1dda5; }
      @media (max-width: 640px) {
        .ripples-topbar { padding: 22px 20px; }
        .ripples-top-note { display: none; }
        .ripples-bottom-note { bottom: 22px; left: 20px; }
        .ripples-back { right: 20px; bottom: 22px; }
      }
    </style>
  </head>
  <body>
    <main class="ripples-shell">
      <canvas data-ripples-canvas class="ripples-canvas" aria-label="Water, plant, and fire sources sending out expanding elemental ripples"></canvas>
      <header class="ripples-topbar">
        <div class="ripples-brand">
          <div class="ripples-mark" aria-hidden="true"><span></span><span></span><span></span></div>
          <div class="ripples-copy">
            <strong>RIPPLES</strong>
            <span>AFTER THE FIELD / WATER · PLANT · FIRE</span>
          </div>
        </div>
        <div class="ripples-top-note">A quiet chemistry of light</div>
      </header>
      <div class="ripples-bottom-note">ELEMENTAL EXPANSION / WATER · PLANT · FIRE</div>
      <a class="ripples-back" href="../">BACK TO SHARDS</a>
    </main>
    <script src="../ripples.js?v=__ASSET_VERSION__" defer></script>
  </body>
</html>
